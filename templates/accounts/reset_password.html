{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | OSAS Voting System</title>
  <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>
<body class="auth-body">
  <div class="auth-split">

    <div class="auth-art" style="background-image:url('{% static 'images/login-bg.png' %}')"></div>

    <div class="auth-panel">
      <div class="auth-card">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-sub">Choose a new password</p>

        <form method="post" novalidate>
          {% csrf_token %}

          <label class="auth-label">NEW PASSWORD</label>
          <div class="pw-wrap">
            {{ form.password1 }}
            <button type="button" class="pw-eye" data-target="{{ form.password1.id_for_label }}" aria-label="Show password">👁</button>
          </div>
          {% for e in form.password1.errors %}<p class="auth-error">{{ e }}</p>{% endfor %}

          <label class="auth-label">CONFIRM NEW PASSWORD</label>
          <div class="pw-wrap">
            {{ form.password2 }}
            <button type="button" class="pw-eye" data-target="{{ form.password2.id_for_label }}" aria-label="Show password">👁</button>
          </div>
          {% for e in form.password2.errors %}<p class="auth-error">{{ e }}</p>{% endfor %}

          <div class="auth-center"><button type="submit" class="btn-main">CHANGE PASSWORD</button></div>
          <p class="auth-hint"><a href="{% url 'accounts:login' %}">← Back to log in</a></p>
        </form>
      </div>
    </div>

  </div>
  <script src="{% static 'accounts/js/auth.js' %}"></script>
</body>
</html>
